# Reyu.ai nginx config — serves SPA + proxies /api/ to FastAPI backend
server {
    listen 80;
    server_name _;

    # Serve pre-built React SPA
    root /usr/share/nginx/html;
    index index.html;

    # Aggressive caching for hashed assets (Vite adds hash to filenames)
    location ~* \.(js|css|woff2?|ttf|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API requests to FastAPI backend
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    # WebSocket upgrade for /ws/ (live option chain, ticks)
    location /ws/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # SPA fallback — all unknown paths return index.html (React Router handles them)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint (used by systemd and GCE health checks)
    location /health {
        proxy_pass http://backend:8000/api/health;
    }
}
