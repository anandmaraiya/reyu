# docker-compose.cloud.yml — GCE e2-micro (1 vCPU, 1 GB RAM)
# Usage:  docker compose -f docker-compose.cloud.yml up -d
#
# Differences from dev compose:
#   - No frontend dev server; nginx serves the pre-built dist/
#   - Memory limits keep total RSS under 900 MB so the OS isn't OOM-killed
#   - Backend port is NOT exposed (only nginx :80 is public)
#   - Postgres uses 256 MB shared_buffers (safe for 1 GB host)

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: reyu-postgres
    environment:
      POSTGRES_USER: reyu
      POSTGRES_PASSWORD: reyu
      POSTGRES_DB: reyu
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command: >
      postgres
        -c shared_buffers=128MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c max_connections=40
    volumes:
      - reyu-pg:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 280M

  redis:
    image: redis:7-alpine
    container_name: reyu-redis
    command: redis-server --maxmemory 80mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - reyu-redis:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M

  backend:
    build: ./backend
    container_name: reyu-backend
    env_file: .env
    # Only reachable by nginx — not exposed to host
    expose:
      - "8000"
    volumes:
      - reyu-data:/app/data
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 480M

  nginx:
    image: nginx:1.25-alpine
    container_name: reyu-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 40M

volumes:
  reyu-data:
  reyu-redis:
  reyu-pg:
