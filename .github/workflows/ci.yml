name: CI

on:
  pull_request:
    branches: [main, develop, basic1]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Secret scan first — cheapest, catches the highest-impact mistake ──
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Backend: lint + typecheck + test + coverage ───────────────────────
  backend:
    name: Backend (ruff / mypy / pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: reyu
          POSTGRES_PASSWORD: reyu
          POSTGRES_DB: reyu
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reyu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-cov pytest-asyncio testcontainers[postgres] respx fakeredis

      - name: Lint (ruff)
        run: ruff check app/

      - name: Type check (mypy — non-blocking during rollout)
        run: mypy app/ --ignore-missing-imports || true
        continue-on-error: true

      - name: Test + coverage (money-path scope, PRODUCT_SPEC §7.1)
        env:
          DATABASE_URL: postgresql+asyncpg://reyu:reyu@localhost:5432/reyu
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-for-ci
        run: |
          pytest tests/ \
            --cov=app/strategy --cov=app/legal.py \
            --cov=app/templates_catalog.py --cov=app/routers/tv_hooks.py \
            --cov-report=xml --cov-report=term

      - name: Coverage floor gate (money-path)
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse('coverage.xml').getroot()
          line_rate = float(root.attrib.get('line-rate', 0)) * 100
          print(f"Money-path line coverage: {line_rate:.1f}%")
          # Ratchet toward 85% money-path per PRODUCT_SPEC.md §7.1.
          # 25% = pure-unit suite baseline (spec 92%, equity_features 95%,
          # runner math). The DB-coupled runner loops (runner.py,
          # paper_live, equity_paper_live, regime_router_live) are 0% and
          # need integration fixtures — raise this floor with each PR that
          # adds them. Lowering the floor requires CPO sign-off.
          floor = 25
          if line_rate < floor:
              print(f"::error::Money-path coverage {line_rate:.1f}% below floor {floor}%")
              raise SystemExit(1)
          EOF

      - name: Compliance copy gate (PRODUCT_SPEC §6)
        working-directory: .
        run: |
          # Block user-facing profitability/ranking claims. Exemptions:
          # tests, and app/legal.py (the ToS legitimately PROHIBITS these
          # phrases, so it must be allowed to mention them).
          if grep -rniE "guaranteed returns|sure profit|top performing strateg|assured profit" \
              backend/app/ frontend/src/ \
              --include="*.py" --include="*.tsx" --include="*.ts" \
              | grep -v "test_" | grep -v "app/legal.py" | grep -vi "banned"; then
            echo "::error::User-facing copy contains profitability claims (PRODUCT_SPEC §6)"
            exit 1
          fi
          echo "Copy gate clean."

  # ── Frontend: eslint + typecheck + build ──────────────────────────────
  frontend:
    name: Frontend (eslint / tsc / vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install (skip Windows-only Rollup binary; see Dockerfile)
        run: |
          rm -f package-lock.json
          npm install

      - name: Lint (eslint if configured)
        run: npx eslint src/ --max-warnings 0 || echo "ESLINT_MISSING=true"
        continue-on-error: true

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ── Schema check on API changes ───────────────────────────────────────
  schema-check:
    name: OpenAPI schema regression
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder — enable once we have a baseline schema.json
        run: echo "Schema check will diff against docs/openapi.json — snapshot to be added."

  # ── Overall gate: everything green ────────────────────────────────────
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [secrets, backend, frontend]
    if: always()
    steps:
      - name: Verify gates
        run: |
          if [ "${{ needs.secrets.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "::error::One or more required gates failed"
            exit 1
          fi
          echo "All CI gates green."
